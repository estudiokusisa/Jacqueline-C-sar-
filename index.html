<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jacqueline & César - Nuestro matrimonio</title>

<!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Si tu favicon es formato .ico, usa: <link rel="icon" href="favicon.ico" type="image/x-icon"> -->

    <meta property="og:title" content="Jacqueline & César - Nuestro matrimonio">
    <meta property="og:description" content="Toca aqui para acceder">
    <meta property="og:image" content="https://jacqueline-cesar.netlify.app/miniatura.jpg">
    <meta property="og:url" content="https://jacqueline-cesar.netlify.app/">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; 
            min-height: 100%;
            font-family: 'Cormorant Garamond', serif;
            background-color: #dbe2e8;
            background-image: url('fondoPatron.png');
            background-repeat: no repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .invitation-container {
            width: 100%; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 15px;
        }

        .envelope-box {
            width: 100%; 
            max-width: 360px;
            margin-bottom: 20px;
            opacity: 0;
        }
        .listo .envelope-box { animation: fallFromTop 1.2s ease-out forwards; }

        .envelope-box img { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.12)); }

        .content-box {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 340px;
            opacity: 0;
        }
        .listo .content-box { animation: riseFromBottom 1.2s ease-out forwards; }

        .guest-info {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 22px 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%; border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .welcome-text { font-size: 1.1rem; color: #555e6d; font-style: italic; margin-bottom: 6px; }
        .guest-name {
            font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600;
            color: #3b4a5a; margin-bottom: 0; font-style: italic;
            display: inline-block; border-bottom: 1px solid #7c8d9e;
            padding-bottom: 2px; padding-left: 8px; padding-right: 8px;
            max-width: 100%; word-break: break-word;
        }
        .name-wrap { margin-bottom: 18px; text-align: center; }
        .passes-container { font-size: 1.05rem; color: #555e6d; font-style: italic; margin-top: -6px; margin-bottom: 18px; }
        .passes-label { display: block; }
        .passes-number { display: block; font-weight: 600; color: #3b4a5a; font-size: 1.15rem; }

        .btn-acceder {
            display: inline-block; background-color: #728494;
            color: #ffffff; text-decoration: none; padding: 10px 24px;
            border-radius: 50px; font-size: 0.9rem; letter-spacing: 1.5px;
            text-transform: uppercase; transition: background-color 0.3s;
        }
        .btn-acceder:hover { background-color: #5c6c7b; }

        @keyframes fallFromTop {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes riseFromBottom {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .envelope-box {
                max-width: 380px !important;
                margin-bottom: 25px !important; 
            }
            .content-box {
                max-width: 330px !important; 
            }
        }
    </style>
</head>
<body>
    <div class="invitation-container">
        <div class="envelope-box">
            <img src="sobre.png" alt="Sobre Jacqueline & César">
        </div>
        <div class="content-box">
            <div class="guest-info">
                <p class="welcome-text">Con especial afecto para:</p>
                <div class="name-wrap"><h1 class="guest-name" id="nombreInvitado">Cargando...</h1></div>
                <!-- Mientras carga, reserva el espacio (invisible). Si hay pases adicionales (mayor a 0) se muestra; si es 0 se quita -->
                <div class="passes-container" id="contenedorPases" style="visibility:hidden;">
                    <span class="passes-label" id="etiquetaPases">Pases adicionales</span>
                    <span class="passes-number" id="numeroPases">2 pases</span>
                </div>
                <a href="https://kusisainvitaciones.com/jacqueline-y-cesar-" class="btn-acceder">VER DETALLES</a>
            </div>
        </div>
    </div>

    <script>
        const PALABRAS_PASES = {
            1: "Un pase", 2: "Dos pases", 3: "Tres pases", 4: "Cuatro pases", 5: "Cinco pases",
            6: "Seis pases", 7: "Siete pases", 8: "Ocho pases", 9: "Nueve pases", 10: "Diez pases"
        };

        function mostrarPases(valor) {
            const n = parseInt(valor, 10);
            const contenedor = document.getElementById('contenedorPases');

            // Si es 0, vacío o no es número: no se muestra nada
            if (isNaN(n) || n <= 0) {
                contenedor.style.display = 'none';
                return;
            }

            document.getElementById('etiquetaPases').textContent = (n === 1) ? "Pase adicional" : "Pases adicionales";
            document.getElementById('numeroPases').textContent = n + (n === 1 ? " pase" : " pases");
            contenedor.style.display = 'block';
            contenedor.style.visibility = 'visible';
        }

        // Muestra todo junto (con la animación) solo cuando ya están los datos y el sobre
        let yaRevelado = false;
        function revelar() {
            if (yaRevelado) return;
            yaRevelado = true;
            document.body.classList.add('listo');
        }
        function esperarSobre() {
            return new Promise(resolve => {
                const img = document.querySelector('.envelope-box img');
                if (img.complete) return resolve();
                img.addEventListener('load', resolve);
                img.addEventListener('error', resolve);
            });
        }
        // Por seguridad: si algo tarda demasiado, se muestra igual
        setTimeout(revelar, 6000);

        async function consultarGoogleSheets() {
            // El sobre y el cuadro blanco salen en cuanto carga el sobre,
            // sin esperar a Google; el nombre y los pases se llenan después.
            esperarSobre().then(revelar);
            await cargarDatos();
        }

        async function cargarDatos() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            
            const urlAppsScript = "https://script.google.com/macros/s/AKfycbwLIbm5786MXIblgX7dqpg2vwsRS6RiZFL3CkzURwaz_caSa5j-z0T3GN3vgcDB1eUb/exec";

            // Sin ID (vista previa): se muestra un ejemplo
            if (!idParam) {
                document.getElementById('nombreInvitado').textContent = "Nombre del invitado";
                mostrarPases(2);
                return;
            }

            try {
                const response = await fetch(`${urlAppsScript}?id=${encodeURIComponent(idParam)}`);
                const data = await response.json();
                document.getElementById('nombreInvitado').textContent = data.nombre || "Estimado Invitado";
                mostrarPases(data.pases);
            } catch (error) {
                document.getElementById('nombreInvitado').textContent = "Estimado Invitado";
                mostrarPases(0); // si falla la consulta, no se promete ningún pase
            }
        }
        window.onload = consultarGoogleSheets;
    </script>
</body>
</html>
